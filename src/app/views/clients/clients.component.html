<c-toaster style="margin-top: 115px" placement="top-end" position="fixed">
  <c-toast
    [autohide]="false"
    [fade]="false"
    [visible]="showToast"
    color="{{ ToastColor }}"
    #toast="cToast"
  >
    <c-toast-body style="color: white">{{ ToastMessage }}</c-toast-body>
  </c-toast>
</c-toaster>

<c-card>
  <c-card-header><strong>Clients</strong></c-card-header>
  <c-card-body>
    <c-smart-table
      [activePage]="1"
      [columnSorter]="true"
      [columns]="CustomersColumns"
      [items]="CustomersData"
      [itemsPerPageSelect]="true"
      [itemsPerPage]="20"
      tableFilterPlaceholder="Type Here"
      [sorterValue]="{ column: 'UserDisplayName', state: 'asc' }"
      [tableFilter]="true"
      tableFilterLabel="Search:"
      [itemsPerPageLabel]="totalCount + ' Items Per Page:'"
      noItemsLabel="No Record Found"
      [tableProps]="{ hover: true, striped: true, responsive: true }"
      [tableBodyProps]="{ align: 'middle' }"
      [loading]="inProgress"
      cleaner
      header
      pagination
      [columnFilter]="true"
    >
      <ng-template
        cTemplateId="tableData"
        let-columnName="columnName"
        let-item="item"
        let-tdContent="tdContent"
      >
        <td>
          <ng-container [ngSwitch]="columnName">
            <ng-container *ngSwitchCase="'Actions'">
              <div class="action-cell">
                <button
                  cButton
                  color="primary"
                  size="sm"
                  variant="ghost"
                  (click)="openEditModal(item)"
                  title="Edit client"
                  class="icon-btn"
                >
                  <svg cIcon name="cilPencil"></svg>
                </button>
                <button
                  cButton
                  color="info"
                  size="sm"
                  variant="ghost"
                  (click)="goToRMHQBO(item)"
                  title="Open in RMH QBO"
                  class="icon-btn"
                >
                  <svg cIcon name="cilLink"></svg>
                </button>
              </div>
            </ng-container>

            <ng-container *ngSwitchCase="'IsActive'">
              <c-form-check [switch]="true" class="custom-switch">
                <input cFormCheckInput type="checkbox" [checked]="tdContent" disabled />
              </c-form-check>
            </ng-container>

            <ng-container *ngSwitchCase="'IsOnline'">
              <c-form-check [switch]="true" class="custom-switch">
                <input cFormCheckInput type="checkbox" [checked]="tdContent" disabled />
              </c-form-check>
            </ng-container>

            <ng-container *ngSwitchDefault>
              {{ tdContent }}
            </ng-container>
          </ng-container>
        </td>
      </ng-template>
    </c-smart-table>
  </c-card-body>
</c-card>

<c-modal
  alignment="center"
  backdrop="static"
  [visible]="EditModalVisible"
  id="EditClientModal"
>
  <c-modal-header>
    <h5 cModalTitle>Edit Client</h5>
    <button (click)="closeEditModal()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <form
      cForm
      cRow
      #EditForm_="ngForm"
      class="row g-3"
      (ngSubmit)="saveEdit(EditForm_)"
      novalidate
    >
      <c-col [md]="6">
        <label cLabel for="FirstName">First Name</label>
        <input
          cFormControl
          id="FirstName"
          name="FirstName"
          type="text"
          [(ngModel)]="EditForm.FirstName"
        />
      </c-col>
      <c-col [md]="6">
        <label cLabel for="LastName">Last Name</label>
        <input
          cFormControl
          id="LastName"
          name="LastName"
          type="text"
          [(ngModel)]="EditForm.LastName"
        />
      </c-col>
      <c-col [md]="12">
        <label cLabel for="UserDisplayName">Display Name</label>
        <input
          cFormControl
          id="UserDisplayName"
          name="UserDisplayName"
          type="text"
          [(ngModel)]="EditForm.UserDisplayName"
        />
      </c-col>
      <c-col [md]="6">
        <label cLabel for="UserName">Username</label>
        <input
          cFormControl
          id="UserName"
          name="UserName"
          type="text"
          [(ngModel)]="EditForm.UserName"
        />
      </c-col>
      <c-col [md]="6">
        <label cLabel for="MobilePhoneNumber">Phone Number</label>
        <input
          cFormControl
          id="MobilePhoneNumber"
          name="MobilePhoneNumber"
          type="text"
          [(ngModel)]="EditForm.MobilePhoneNumber"
        />
      </c-col>
      <c-col [md]="12" class="d-flex justify-content-end gap-2">
        <button
          type="button"
          cButton
          color="secondary"
          variant="outline"
          (click)="closeEditModal()"
        >
          Cancel
        </button>
        <button
          cLoadingButton
          [loading]="EditLoading"
          cButton
          disabledOnLoading
          color="primary"
          type="submit"
        >
          <svg cIcon name="cilSave"></svg> Save
        </button>
      </c-col>
    </form>
  </c-modal-body>
</c-modal>

<c-toaster style="margin-top: 115px" placement="top-end" position="fixed">
  <c-toast
    [autohide]="false"
    [fade]="false"
    [visible]="showToast"
    color="{{ ToastColor }}"
    #toast="cToast"
  >
    <c-toast-body style="color: white">{{ ToastMessage }}</c-toast-body>
  </c-toast>
</c-toaster>

<c-card class="mb-3">
  <c-card-header><strong>Logs</strong></c-card-header>
  <c-card-body>
    <c-row class="g-3 align-items-end">
      <c-col [md]="4">
        <label cLabel for="LogType">Log Type *</label>
        <select
          cSelect
          id="LogType"
          name="LogType"
          [(ngModel)]="logType"
          (ngModelChange)="onLogTypeChange()"
        >
          <option value="">Select Log Type</option>
          <option value="api">API Logs</option>
          <option value="service">Service Logs</option>
        </select>
      </c-col>

      <c-col [md]="4" *ngIf="logType === 'service'">
        <label cLabel for="ClientSelect">Client *</label>
        <select
          cSelect
          id="ClientSelect"
          name="ClientSelect"
          [(ngModel)]="selectedClientGUID"
          [disabled]="loadingClients"
        >
          <option value="">{{ loadingClients ? 'Loading clients...' : 'Select Client' }}</option>
          <option *ngFor="let c of clients" [value]="c.ClientServiceGUID">
            {{ c.User_DisplayName || c.EmailAddress || c.ClientName || ('Client ' + c.Id) }}
          </option>
        </select>
      </c-col>

      <c-col [md]="4" class="d-flex gap-2">
        <button
          cLoadingButton
          [loading]="fetching"
          cButton
          disabledOnLoading
          color="primary"
          type="button"
          (click)="fetchLog()"
          [disabled]="!canFetch()"
        >
          <svg cIcon name="cilCloudDownload"></svg> Fetch
        </button>

        <button
          *ngIf="hasResult"
          type="button"
          cButton
          color="secondary"
          variant="outline"
          (click)="clearResult()"
        >
          Clear
        </button>
      </c-col>
    </c-row>
  </c-card-body>
</c-card>

<c-card *ngIf="hasResult || fetching">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>{{ logType === 'api' ? 'API Log' : 'Service Log' }}</strong>
    <button
      *ngIf="hasResult && logContent"
      type="button"
      cButton
      color="primary"
      variant="outline"
      size="sm"
      (click)="downloadAsFile()"
    >
      <svg cIcon name="cilCloudDownload"></svg> Save as file
    </button>
  </c-card-header>
  <c-card-body class="p-0">
    <div *ngIf="fetching" class="text-center py-4">
      <c-spinner color="primary"></c-spinner>
    </div>
    <pre *ngIf="!fetching" class="log-output">{{ logContent || 'No log content.' }}</pre>
  </c-card-body>
</c-card>

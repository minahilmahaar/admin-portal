<div class="bg-light dark:bg-transparent min-vh-100 d-flex flex-row align-items-center">
  <c-container breakpoint="md">
    <c-row class="justify-content-center">
      <c-col lg="10" xl="8">
        <c-card-group>
          <c-card class="p-4">
            <c-card-body>
              <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
                <h2>Login</h2>
                
                <div class="form-group">
                  <label for="username">Email</label>
                  <input 
                    id="username" 
                    type="email" 
                    formControlName="username" 
                    placeholder="Enter your email"
                    [class.is-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched">
                  <div *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-message">
                    <div *ngIf="loginForm.get('username')?.errors?.['required']">Email is required</div>
                    <div *ngIf="loginForm.get('username')?.errors?.['email']">Please enter a valid email</div>
                  </div>
                </div>
              
                <div class="form-group">
                  <label for="password">Password</label>
                  <input 
                    id="password" 
                    type="password" 
                    formControlName="password" 
                    placeholder="Enter your password"
                    [class.is-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
                  <div *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-message">
                    <div *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</div>
                    <div *ngIf="loginForm.get('password')?.errors?.['minlength']">
                      Password must be at least 6 characters
                    </div>
                  </div>
                </div>
              
                <div class="form-group">
                  <re-captcha 
                    formControlName="recaptcha"
                    (resolved)="onCaptchaResolved($event)"
                    siteKey="6LcwiCMrAAAAACv_PtQ9ozR6dySL3M8TpA09BWc5 "> <!-- This can be omitted since it's in the provider -->
                  </re-captcha>
                  <div *ngIf="loginForm.get('recaptcha')?.invalid && loginForm.get('recaptcha')?.touched" class="error-message">
                    Please complete the reCAPTCHA
                  </div>
                </div>
              
                <button 
                  type="submit" 
                  class="submit-btn" 
                  [disabled]="!loginForm.valid">
                  Login
                </button>
              </form>
            </c-card-body>
          </c-card>
          
        </c-card-group>
      </c-col>
    </c-row>
  </c-container>
</div>

<c-toaster style="margin-top: 115px" placement="top-end" position="fixed">
  <c-toast
    [autohide]="false"
    [fade]="false"
    [visible]="showToast"
    color="{{ ToastColor }}"
    #toast="cToast"
  >
    <c-toast-body style="color: white">{{ ToastMessage }}</c-toast-body>
  </c-toast>
</c-toaster>

<c-card class="mb-3">
  <c-card-header><strong>Query Screen</strong></c-card-header>
  <c-card-body>
    <c-row class="g-3 align-items-end">
      <c-col [md]="6">
        <label cLabel for="ClientSelect">Client *</label>
        <select
          cSelect
          id="ClientSelect"
          name="ClientSelect"
          [(ngModel)]="selectedClientGUID"
          [disabled]="loadingClients"
        >
          <option value="">{{ loadingClients ? 'Loading clients...' : 'Select Client' }}</option>
          <option *ngFor="let c of clients" [value]="c.ClientServiceGUID">
            {{ c.User_DisplayName || c.EmailAddress || c.ClientName || ('Client ' + c.Id) }}
          </option>
        </select>
      </c-col>
    </c-row>
  </c-card-body>
</c-card>

<c-card class="mb-3">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Query Editor</strong>
    <div>
      <button
        cButton
        color="secondary"
        variant="outline"
        size="sm"
        class="me-2"
        type="button"
        (click)="clearQuery()"
      >
        Clear
      </button>
      <button
        cLoadingButton
        [loading]="executing"
        cButton
        disabledOnLoading
        color="primary"
        size="sm"
        type="button"
        (click)="executeQuery()"
      >
        <svg cIcon name="cilMediaPlay"></svg> Execute
      </button>
    </div>
  </c-card-header>
  <c-card-body class="p-0">
    <ngx-monaco-editor
      class="query-editor"
      [options]="editorOptions"
      [(ngModel)]="query"
    ></ngx-monaco-editor>
  </c-card-body>
</c-card>

<c-card class="result-card">
  <c-card-header class="d-flex justify-content-between align-items-center">
    <strong>Result</strong>
    <div class="d-flex align-items-center" style="gap: 10px;">
      <span class="text-medium-emphasis" style="font-size: 11px;" *ngIf="resultColumns.length">
        {{ totalCount }}{{ resultColumns.length }} column(s)
      </span>
      <button
        cButton
        color="success"
        variant="outline"
        size="sm"
        type="button"
        (click)="exportToExcel()"
        [disabled]="!resultData.length"
        title="Export current result as CSV (opens in Excel)"
      >
        <svg cIcon name="cilCloudDownload" class="me-1"></svg>
        Export Excel
      </button>
    </div>
  </c-card-header>
  <c-card-body>
    <div *ngIf="!resultColumns.length && !executing" class="text-center text-medium-emphasis py-4">
      Run a query to see results.
    </div>
    <div class="result-scroll" *ngIf="resultColumns.length">
      <c-smart-table
        [activePage]="1"
        [columnSorter]="true"
        [columns]="resultColumns"
        [items]="resultData"
        [itemsPerPageSelect]="true"
        [itemsPerPage]="25"
        [tableFilter]="true"
        tableFilterLabel="Search:"
        tableFilterPlaceholder="Type Here"
        [itemsPerPageLabel]="totalCount + ' Items Per Page:'"
        noItemsLabel="No Record Found"
        [tableProps]="{ hover: true, striped: false, responsive: true, small: true, borderless: true }"
        [tableBodyProps]="{ align: 'middle' }"
        [loading]="executing"
        header
        pagination
        cleaner
        [columnFilter]="true"
      ></c-smart-table>
    </div>
  </c-card-body>
</c-card>

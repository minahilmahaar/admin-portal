<c-toaster style="margin-top: 115px" placement="top-end" position="fixed">
  <c-toast
    [autohide]="false"
    [fade]="false"
    [visible]="showToast"
    color="{{ ToastColor }}"
    #toast="cToast"
  >
    <c-toast-body style="color: white">{{ ToastMessage }}</c-toast-body>
  </c-toast>
</c-toaster>

<c-card>
  <c-card-body>

      <button
        cButton
        color="primary"
        (click)="toggleRegisterUserModal()"
        class="mb-3"
      >
        <svg cIcon name="cilUserPlus"></svg> Add User
      </button>

    <c-smart-table
      [activePage]="1"
      [columnSorter]="true"
      [columns]="CustomersColumns"
      [itemsPerPageSelect]="true"
      [itemsPerPage]="10"
      tableFilterPlaceholder="Type Here"
      [items]="CustomersData"
      [sorterValue]="{ column: 'name', state: 'asc' }"
      [tableFilter]="true"
      tableFilterLabel="Search:"
      [itemsPerPageLabel]="
        totalCount ? totalCount + ' Items Per Page:' : 'Items Per Page:'
      "
      noItemsLabel="No Record Found"
      [tableProps]="{ hover: true, striped: true, responsive: true }"
      [tableBodyProps]="{ align: 'middle' }"
      cleaner
      clickableRows
      header
      pagination
      
      [columnFilter]="true"
    >
    <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
      <td>
        @switch (columnName) {
          @case ('show') {
            <button (click)="toggleDetails(item)" cButton color="primary" size="sm" variant="outline">
              Show
            </button>
          }
          @default {
            {{ tdContent }}
          }
        }
      </td>
    </ng-template>
      <!-- <ng-template
        cTemplateId="tableData"
        let-columnName="columnName"
        let-item="item"
        let-tdContent="tdContent"
      >
        <td>
          <ng-container [ngSwitch]="columnName">

            
            <ng-container *ngSwitchDefault>
              {{ tdContent }}
            </ng-container>

          </ng-container>
        </td>
        <ng-container >
          <td *ngIf="columnName == 'actions'"> 
            <button (click)="toggleDetails(item.id)" cButton color="primary" size="sm" variant="outline">
              Show
            </button>
          </td>
        </ng-container>
      </ng-template> -->
    </c-smart-table>
  </c-card-body>
</c-card>

<c-modal #AddUserModal [visible]="RegisterUserModalvisible" alignment="center" id="AddUserModal">
  <c-modal-header>
    <h5 cModalTitle>Add User</h5>
    <button (click)="toggleRegisterUserModal()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <form
      cForm
      class="row g-3"
      (ngSubmit)="AddUser(EmailAddress.value, FirstName.value, LastName.value)"
    >
      <c-col [md]="6">
        <label cLabel for="FirstName">First Name:</label>
        <input
          cFormControl
          required
          id="FirstName"
          #FirstName
          name="FirstName"
          type="text"
        />
      </c-col>
      <c-col [md]="6">
        <label cLabel for="LastName">Last Name:</label>
        <input
          cFormControl
          required
          id="LastName"
          #LastName
          name="LastName"
          type="text"
        />
      </c-col>
      <c-col [md]="12">
        <label cLabel for="EmailAddress">Email Address:</label>
        <input
          cFormControl
          required
          id="EmailAddress"
          #EmailAddress
          name="EmailAddress"
          type="email"
        />
      </c-col>
      <c-col [md]="12" class="d-flex justify-content-end">
        <button
          cLoadingButton [loading]="loading[0]" cButton disabledOnLoading
          color="primary"
          type="submit"
          [disabled]="!FirstName.value || !LastName.value || !EmailAddress.value"
        >
          <svg cIcon name="cilSave"></svg> Save
        </button>
      </c-col>
    </form>
  </c-modal-body>
</c-modal>


<c-modal #EditUserModal [visible]="EditUserModalvisible" alignment="center" id="AddUserModal">
  <c-modal-header>
    <h5 cModalTitle>Edit User</h5>
    <button (click)="toggleEditUserModal()" cButtonClose></button>
  </c-modal-header>
  <c-modal-body>
    <form
      cForm
      class="row g-3"
      (ngSubmit)="EditUser(UserDisplayName.value, FirstName.value, LastName.value, PhoneNumber.value)"
    >
      <c-col [md]="6">
        <label cLabel for="FirstName">First Name:</label>
        <input
          cFormControl
          required
          id="FirstName"
          #FirstName
          name="FirstName"
          type="text"
          [value]="EditUserForm.FirstName"
        />
      </c-col>
      <c-col [md]="6">
        <label cLabel for="LastName">Last Name:</label>
        <input
          cFormControl
          required
          id="LastName"
          #LastName
          name="LastName"
          type="text"
          [value]="EditUserForm.LastName"
        />
      </c-col>
      <c-col [md]="12">
        <label cLabel for="UserDisplayName">User Display Name:</label>
        <input
          cFormControl
          required
          id="UserDisplayName"
          #UserDisplayName
          name="UserDisplayName"
          type="text"
          [value]="EditUserForm.UserDisplayName"
        />
      </c-col>
  
      <c-col [md]="12">
        <label cLabel for="PhoneNumber">Phone Number:</label>
        <input
          cFormControl
          required
          id="PhoneNumber"
          #PhoneNumber
          name="PhoneNumber"
          type="text"
        />
      </c-col>
      <c-col [md]="12" class="d-flex justify-content-end">
        <button
          cLoadingButton [loading]="loading[0]" cButton disabledOnLoading
          color="primary"
          type="submit"
          [disabled]="!FirstName.value || !LastName.value || !EmailAddress.value"
        >
          <svg cIcon name="cilSave"></svg> Save
        </button>
      </c-col>
    </form>
  </c-modal-body>
</c-modal>
